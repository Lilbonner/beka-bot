name: ci

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Проверка синтаксиса
        run: |
          node --check src/index.js
          node --check src/import.js
          node --check src/db.js
          node --check src/ghost.js
          node --check src/markov.js
          node --check src/parseHtml.js
          node --check src/config.js
